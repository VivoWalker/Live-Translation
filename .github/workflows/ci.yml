name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Benchmark CLI smoke check
        run: python tools/benchmark.py --help

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Syntax check
        run: git ls-files -z -- '*.js' '*.mjs' ':!extension/wasm/**' | xargs -0 -n1 node --check
      - run: node --test --test-isolation=none tests/*.test.mjs

  chromium:
    name: Chromium page integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test page and mocked extension runtime
        run: |
          export JLS_CHROME="$(command -v google-chrome || command -v chromium)"
          "$JLS_CHROME" --version
          node tools/content_check.mjs

  package:
    name: Tagged extension artifact
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python, javascript, chromium]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package tracked extension files
        run: |
          python -c 'import json, os; version = json.load(open("extension/manifest.json"))["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Tag must match the extension manifest version"'
          mkdir -p dist
          git archive --format=zip --output=dist/Live-Translation-extension.zip HEAD extension LICENSE LICENSES THIRD_PARTY_NOTICES.md
          cd dist
          sha256sum Live-Translation-extension.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Live-Translation-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
