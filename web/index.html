<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>字幕工作台 · Live Translation</title>
  <link rel="stylesheet" href="/static/interface.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand"><span class="brand-mark" aria-hidden="true"></span>Live Translation</div>
      <span class="status-pill" id="connection" data-phase="idle" role="status">
        <span class="dot" aria-hidden="true"></span><span id="status">待开始</span>
      </span>
    </div>
  </header>

  <main class="workspace">
    <h1>字幕工作台</h1>
    <div class="workspace-grid">
      <div class="session">
        <section class="surface stage-panel" aria-labelledby="stage-title">
          <div class="stage-head">
            <h2 id="stage-title">字幕预览</h2>
            <div class="stage-tools">
              <span id="stage-languages">日语 → 简体中文</span>
              <a class="view-settings" href="#caption-editor">字幕设置</a>
            </div>
          </div>
          <div class="stage" id="caption-stage">
            <div class="wave" aria-hidden="true">
              <i style="--height: 14%"></i><i style="--height: 28%"></i><i style="--height: 44%"></i>
              <i style="--height: 69%"></i><i style="--height: 51%"></i><i style="--height: 86%"></i>
              <i style="--height: 100%"></i><i style="--height: 74%"></i><i style="--height: 40%"></i>
              <i style="--height: 55%"></i><i style="--height: 30%"></i><i style="--height: 17%"></i>
              <i style="--height: 11%"></i>
            </div>
            <div id="stage-preview"></div>
            <p class="stage-empty" id="stage-empty" hidden>等待语音</p>
          </div>
        </section>

        <section class="surface capture-panel" aria-labelledby="capture-title">
          <h2 id="capture-title">音频与翻译</h2>
          <div class="fields">
            <label class="field">
              <span>本地服务访问令牌</span>
              <input id="access-token" type="password" autocomplete="off" placeholder="输入终端显示的令牌">
            </label>
            <label class="field">
              <span>译文语言</span>
              <select id="target">
                <option value="zh">简体中文</option>
                <option value="en">English</option>
              </select>
            </label>
          </div>
          <p class="message" id="message" role="status" hidden></p>
          <div class="capture-actions">
            <button id="btn-start" class="button primary" type="button"><span class="play-icon" aria-hidden="true"></span>共享标签页</button>
            <button id="link-file" class="button" type="button">播放日语样本</button>
            <button id="btn-stop" class="button stop" type="button" hidden><span class="stop-icon" aria-hidden="true"></span>停止字幕</button>
          </div>
        </section>

        <details class="surface diagnostics" id="diagnostics" hidden>
          <summary>会话统计</summary>
          <dl>
            <div><dt>识别与翻译</dt><dd id="engine">—</dd></div>
            <div><dt>已翻译</dt><dd id="stats">0 句</dd></div>
            <div><dt>平均 API 耗时</dt><dd id="latency">—</dd></div>
          </dl>
        </details>
      </div>

      <aside class="surface settings-panel" id="caption-editor" tabindex="-1"></aside>
    </div>
  </main>
  <script src="/static/caption-settings.js"></script>
  <script src="/static/captions.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
